name: 'OriginScan PR Scanner'
description: 'Scan pull requests for vulnerabilities with context-adaptive depth based on code provenance.'

inputs:
  repo-path:
    description: 'Path to the repository root (the repo being scanned)'
    required: false
    default: '.'
  policy:
    description: 'Path to policy.yaml'
    required: false
    default: ''
  budget:
    description: 'Per-PR token budget cap'
    required: false
    default: ''
  format:
    description: 'Output formats (comma-separated: json, md)'
    required: false
    default: 'json,md'
  fail-on-findings:
    description: 'Exit with code 1 if any findings'
    required: false
    default: 'false'
  dry-run:
    description: 'Print comment body instead of posting'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: '${{ github.token }}'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install OriginScan
      shell: bash
      run: |
        # Install OriginScan itself (action/ is inside the OriginScan repo,
        # so the repo root is one level up from action/)
        pip install -e "${{ github.action_path }}/.."

    - name: Generate diff
      shell: bash
      id: diff
      run: |
        cd "${{ inputs.repo-path }}"
        git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/originscan_pr.diff
        echo "diff_file=/tmp/originscan_pr.diff" >> $GITHUB_OUTPUT

    - name: Run OriginScan
      shell: bash
      id: scan
      env:
        ORIGINSCAN_OUT: /tmp/originscan_out
      run: |
        ARGS="--repo ${{ inputs.repo-path }} --diff ${{ steps.diff.outputs.diff_file }}"
        if [ -n "${{ inputs.policy }}" ]; then
          ARGS="$ARGS --policy ${{ inputs.policy }}"
        fi
        if [ -n "${{ inputs.budget }}" ]; then
          ARGS="$ARGS --budget ${{ inputs.budget }}"
        fi
        ARGS="$ARGS --format ${{ inputs.format }}"
        if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
          ARGS="$ARGS --fail-on-findings"
        fi

        # Run scan and capture exit code (do NOT use || true)
        set +e
        originscan scan $ARGS --out "$ORIGINSCAN_OUT"
        SCAN_EXIT=$?
        set -e

        echo "scan_exit=$SCAN_EXIT" >> $GITHUB_OUTPUT
        echo "out_dir=$ORIGINSCAN_OUT" >> $GITHUB_OUTPUT

    - name: Post or print comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        SCAN_EXIT: ${{ steps.scan.outputs.scan_exit }}
        OUT_DIR: ${{ steps.scan.outputs.out_dir }}
      run: |
        COMMENT_FILE="${OUT_DIR}/report.md"

        if [ ! -f "$COMMENT_FILE" ]; then
          echo "No markdown report generated."
        else
          if [ "$DRY_RUN" = "true" ]; then
            echo "--- Dry run: comment body ---"
            cat "$COMMENT_FILE"
          else
            # Update or create comment using the hidden marker
            MARKER="<!-- originscan -->"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            REPO="${{ github.repository }}"

            # Find existing comment with our marker
            COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
              2>/dev/null | head -1)

            BODY=$(cat "$COMMENT_FILE")
            if [ -n "$COMMENT_ID" ]; then
              gh api "repos/$REPO/issues/comments/$COMMENT_ID" \
                -X PATCH -f body="$BODY"
              echo "Updated existing comment $COMMENT_ID"
            else
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="$BODY"
              echo "Posted new comment"
            fi
          fi
        fi

        # Exit with scan's exit code:
        # - 0: no findings (or --fail-on-findings not set)
        # - 1: findings found with --fail-on-findings
        # - 2: usage/runtime error (always propagate)
        if [ "$SCAN_EXIT" = "2" ]; then
          echo "::error::OriginScan scan failed with exit code 2"
          exit 2
        fi
        if [ "$SCAN_EXIT" = "1" ]; then
          echo "::warning::OriginScan found findings (exit 1)"
          exit 1
        fi
        exit 0
