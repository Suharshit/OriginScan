# OriginScan — Experiment Configuration
# Owner: P5 (Experiments lead)
#
# Every value used by exp/run.py, exp/simulate.py and analysis/ lives here.
# Log every change, with its reason, in docs/decisions.md.
# null = not decided yet; the comment names the phase that sets it.

paths:
  slots: data/slots.csv
  labels: data/labels.csv
  split: data/split.csv
  grid_dir: data/grid
  cache_dir: data/cache
  repos: data/repos     # one clone per repo, as <owner>__<name>/
  bodies: data/bodies   # <slot_id>/<variant>.c; slots.csv code_path is relative to data/

# Dev/test split rule: a repo is dev if SHA-256(lowercase owner/name) mod 5 == 0 (~20%)
# Written by scripts/make_split.py. Set frozen: true when tuning starts; after that
# split.csv is never rewritten.
split:
  modulus: 5
  dev_remainder: 0
  frozen: false

# Token caps passed to build_context(caps=...). Do not edit config/context.yaml.
# Rule: ~95th percentile of measured sizes (Phase 2 token pilot).
# Starting values are P4's defaults until the pilot runs.
caps:
  L1: 2000
  L2: 6000
  L3: 15000
tokenizer: cl100k_base   # estimate only; re-count per model in Phase 2

# Models: exact IDs and the date chosen (Phase 3)
detectors:
  cheap:           # self-hosted on Kaggle (2x T4) with vLLM; see notebooks/kaggle_vllm_pilot.ipynb
    provider: vllm
    model_id: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
    chosen_on: 2026-11-02
    serve:           # vLLM 0.33.0, torch 2.14.0+cu130 (torchaudio uninstalled)
      dtype: half
      tensor_parallel_size: 2
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      concurrency: 4   # parallel requests: 3,725 input tok/s vs 1,577 one at a time
  strong:          # different family from cheap. PROVISIONAL: option B (see decisions.md 2026-11-02)
    provider: openrouter
    model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    chosen_on: 2026-11-02
generators:        # key is used in version_id as ai-<key>
  - key: g1
    provider: groq
    model_id: qwen/qwen3.8-27b
    chosen_on: 2026-11-02
  - key: g2
    provider: google
    model_id: models/gemma-4-31b-it   # exact ID from: python scripts/smoke_models.py --list google gemma
    chosen_on: 2026-11-02

# OpenAI-compatible endpoints. Keys come from .env (names below), never from this file.
# Limits are what each console showed on 2026-11-02 (free tier, per account).
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 30            # per model; also 1,000 req/day, 8k tokens/min, 200k tokens/day
    max_input_tokens: 7000   # a request over the 8k TPM limit is refused, so no L3 on Groq
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 20            # 50 req/day free; 1,000 req/day after the one-time $10 top-up
  google:              # Google AI Studio (Gemini API), OpenAI-compatible endpoint, own free key
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    rpm: 30            # Gemma 4 free tier seen Nov 2: 30 RPM, 16k tokens/min, 14,400 req/day
  cerebras:            # deferred: needs a card on file; backup home for the strong detector
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    rpm: 5
  vllm:
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    rpm: null          # no rate limit; Kaggle quota is 30 GPU h/week
temperature:
  detector: null
  generator: null

runs_per_call: 3   # k, for 3-run agreement confidence

# Tuned on dev only (Phase 6) — must be committed before any test-split run
tau: null          # agreement threshold for escalation
lambda: null       # cost weight: accuracy - lambda * (tokens / tokens_L3)
p_origin_start: {} # origin -> start level, learned on dev

# Budget (Phase 2)
money_cap_usd: 10   # one-time OpenRouter top-up (1,000 req/day); everything else free
